# LLM 생성 비교 실험 설정. 하니스(harness/run.py)가 읽는다.
# 동결 후에는 바꾸지 않는다. 바꾸면 이미 돌린 회차와 비교할 수 없다.

[experiment]
reps = 3                    # 같은 (모델, 게임, 조건)을 반복하는 횟수
max_rounds = 5              # 빌드 시도 횟수 상한 (첫 응답 포함)
error_feedback_lines = 100  # 빌드 실패 시 돌려주는 컴파일러 출력 줄 수
noinput_seconds = 30        # 무입력 실행 시간
llm_timeout_seconds = 900   # LLM 호출 한 번의 제한 시간
max_output_tokens = 32000   # 출력 상한. litellm은 max_tokens, claude-cli는 CLAUDE_CODE_MAX_OUTPUT_TOKENS로 줌. codex-cli는 줄 방법이 없음
api_retries = 5             # 일시 오류(타임아웃, 서버 오류) 재시도 횟수 (왕복으로 세지 않음)
prompt_cache = true         # litellm 백엔드만: Claude 계열에 캐시 지점을 둠. 구독 CLI는 스스로 캐시함
limit_wait_minutes = 30     # 구독 CLI가 사용 한도에 걸리면 이만큼 기다렸다가 같은 왕복을 다시 보냄 (회차를 새로 받지 않게)
limit_wait_hours = 6        # 기다리는 총 시간 상한. 넘으면 하니스를 멈추고, 나중에 같은 명령으로 이어서 돌림
seed = 20261114             # 회차 순서를 섞는 시드
build_jobs = 4

[games]
pilot = ["01-pong"]                                         # D11: 퐁은 시범 전용
pilot_models = ["light"]                                    # 시범 실행은 경량 모델(claude-haiku-5-5) 하나로
main = ["02-snake", "04-shooter", "05-card", "08-formation", "10-missile", "11-survivor"]

[conditions.meno]
library = "meno"
rule = "meno 공개 헤더(<meno/...>)와 C++20 표준 라이브러리만 씁니다. SFML 헤더는 쓸 수 없습니다."
template_dir = "templates/meno"
context = "contexts/bundles/meno.md"
mock_source = "smoke/meno/main.cpp"

[conditions.sfml]
library = "SFML 3.1"
rule = "SFML 3.1 헤더(<SFML/...>)와 C++20 표준 라이브러리만 씁니다."
template_dir = "templates/sfml"
context = "contexts/bundles/sfml.md"
mock_source = "smoke/sfml/main.cpp"

# 모델. 각자의 구독으로 돌린다 (PLAN 2.2절 "구독 CLI"). API 비용을 쓰지 않는다.
#   backend = "claude-cli"  Claude Code(claude -p), Claude 구독 로그인
#             "codex-cli"   Codex CLI(codex exec), ChatGPT 구독 로그인
#             "litellm"     API 키 (예산이 생기면). id가 LiteLLM 모델 문자열이고 params를 그대로 넘김
#   id      회차 ID와 기록에 쓰는 이름. 실제 응답 모델 ID는 하니스가 회차마다 따로 기록한다.
#   model   CLI에 넘기는 모델 이름 (--model / -m). 별칭(opus 등)이 아니라 전체 이름을 쓴다.
#   effort  추론 수준. 실험 내내 고정한다 (claude --effort, codex model_reasoning_effort).
#   operator 이 모델을 돌리는 사람의 구독 (기록용)
[[models]]
tier = "top"
id = "claude-cli/claude-opus-5-5"
backend = "claude-cli"
model = "claude-opus-5-5"
effort = "medium"
operator = "Claude Max (1인)"

[[models]]
tier = "light"
id = "claude-cli/claude-haiku-5-5"
backend = "claude-cli"
model = "claude-haiku-5-5"
effort = "medium"
operator = "Claude Max (1인)"

# GPT-5.5는 2026-10-14부터 ChatGPT 로그인 Codex에서 빠졌다(Codex 문서). 날짜 고정판도 쓸 수 없다.
# Plus에서 쓸 수 있는 모델 중 gpt-6.1-sol로 정했다 (문서상 Plus 기본 모델. 별칭이라 회차마다 CLI 버전·날짜를 기록).
[[models]]
tier = "other-vendor"
id = "codex-cli/gpt-6.1-sol"
backend = "codex-cli"
model = "gpt-6.1-sol"
effort = "medium"
operator = "ChatGPT Plus (2인, --shard로 나눔)"
